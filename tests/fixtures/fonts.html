<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Script size regression</title>
<style>
body { margin: 28px; max-width: 760px; color: #202733; background: #fff; font-family: "Times New Roman", "Yu Gothic", serif; font-size: 18px; line-height: 1.5; }
h1 { font-size: 30px; font-weight: 600; }
small { font-size: 12px; }
#fixed { display: block; height: 28px; width: 230px; overflow: hidden; white-space: nowrap; line-height: 28px; }
input { display: block; margin-top: 20px; }
</style>
<h1 id="heading">日本語の見出し</h1>
<p id="body">この地域には静かな公園と便利な商店があります。</p>
<small id="caption">写真の説明</small>
<p id="fixed">短い説明</p>
<input id="input" value="User input" aria-label="Input remains intact">
</html>
